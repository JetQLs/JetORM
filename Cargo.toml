[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Levi Laine shiueo.csh@gmail.com", "Feral rw70578@gmail.com"]
repository = "https://github.com/JetQLs/JetORM"
rust-version = "1.96.0"
description = ""

[workspace.lints.clippy]
too_many_arguments = "allow"
module_inception = "allow"

[workspace.dependencies]
# Internal crates

# External dependencies
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.21.0"
serde_json = "1.0.150"
ipnetwork = "0.21.1"
anyhow = "1.0.103"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
uuid = { version = "1.23.4", features = ["v7", "v4"] }
rand = "0.10.1"
strum = { version = "0.28.0", features = ["derive"] }
