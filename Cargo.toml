[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Levi Laine shiueo.csh@gmail.com", "Feral rw70578@gmail.com"]
repository = "https://github.com/JetQLs/JetORM"
rust-version = "1.96.0"
description = ""

[workspace.lints.clippy]
too_many_arguments = "allow"
module_inception = "allow"

# Benchmarks measure a hot path that crosses several workspace crates
# (jetorm-query -> afterburner -> jetorm-dialect); without fat LTO the
# defaults block cross-crate inlining and understate every contender.
[profile.bench]
lto = "fat"
codegen-units = 1

[workspace.dependencies]
# Internal crates
afterburner = { path = "crates/afterburner" }
jetorm-entity = { path = "crates/jetorm-entity" }
jetorm-derive = { path = "crates/jetorm-derive" }
jetorm-query = { path = "crates/jetorm-query" }
jetorm-dialect = { path = "crates/jetorm-dialect" }
jetorm-executor = { path = "crates/jetorm-executor" }
jetorm-schema = { path = "crates/jetorm-schema" }
jetorm-migration = { path = "crates/jetorm-migration" }
jetorm = { path = "crates/jetorm" }

# External dependencies
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.21.0"
serde_json = "1.0.150"
ipnetwork = "0.21.1"
anyhow = "1.0.103"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
uuid = { version = "1.23.4", features = ["v7", "v4"] }
rand = "0.10.1"
strum = { version = "0.28.0", features = ["derive"] }
proc-macro2 = "1.0.106"
quote = "1.0.46"
syn = { version = "2.0.118", features = ["full"] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
] }
moka = { version = "0.12.15", features = ["sync"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
criterion = "0.8.2"
toml = "1.1.3"
diesel = { version = "2.3.11", default-features = false, features = ["postgres_backend"] }
sea-orm = { version = "2.0.0-rc.42", default-features = false, features = ["macros"] }
