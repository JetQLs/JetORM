[package]
name = "jetorm"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "JetORM, a typed async ORM built on the AfterBurner query optimizer"
license = "Apache-2.0"

[lib]
name = "jetorm"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = ["executor"]
# PostgreSQL execution layer (pulls in sqlx). Disable for frontend-only use,
# for example query construction and SQL rendering without a database.
executor = ["dep:jetorm-executor"]

[dependencies]
afterburner.workspace = true
jetorm-derive.workspace = true
jetorm-dialect.workspace = true
jetorm-entity.workspace = true
jetorm-executor = { workspace = true, optional = true }
jetorm-query.workspace = true

[dev-dependencies]
chrono.workspace = true
jetorm-schema.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
testcontainers-modules.workspace = true
tokio.workspace = true
uuid.workspace = true
